name: mustore
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  toastification: ^3.2.0
  skeletonizer: ^3.0.0
  go_router: ^17.5.0
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  intl: ^0.20.2
  dio: ^5.11.1
  get_it: ^9.3.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  shared_preferences: ^2.5.6
  google_fonts: ^8.2.1
  firebase_core: ^3.11.0
  firebase_auth: ^5.7.0
  flutter_svg: ^2.3.0
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/flags/
    - assets/lottie/

flutter_intl:
  enabled: true